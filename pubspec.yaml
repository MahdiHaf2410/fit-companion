name: fit_companion
description: "A complete offline-first Gym & Nutrition Tracking App with Flutter"
publish_to: 'none'
version: 1.7.0+12

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  fl_chart: ^0.70.2
  shared_preferences: ^2.5.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  mobile_scanner: ^7.5.0
  http: ^1.6.0
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  file_picker: ^13.4.1
  home_widget: ^0.10.0
  health: ^14.0.0
  supabase_flutter: ^2.18.3
  record: ^7.2.0
  url_launcher: ^6.3.3
  youtube_player_iframe: ^6.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  generate: true
